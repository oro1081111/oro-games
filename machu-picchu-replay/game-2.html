const key=(x,y)=>`${x},${y}`;

const meepleNames={statue:'雕像',worker:'工人',priest:'祭司'};
const playerColors={1:'藍',2:'橘',3:'綠',4:'紫',5:'紅'};
function centerSurface(){
  const s=new Map();
  [[0,0,'土'],[1,0,'草'],[0,1,'水'],[1,1,'岩']].forEach(([x,y,land])=>s.set(key(x,y),{tile:0,kind:'land',land,height:1}));
  return s;
}
function reconstruct(ix){
  const surface=centerSurface();
  const meeples=[];
  for(let k=0;k<ix;k++){
    const m=RECORD.moves[k], t=TILES[m.tile];
    const pieces=t.kind==='normal'
      ?[{tile:m.tile,kind:'land',land:t.left,height:m.height},{tile:m.tile,kind:'land',land:t.right,height:m.height}]
      :[{tile:m.tile,kind:'shrine',shrine:t.shrine,focus:t.focus,height:m.height},{tile:m.tile,kind:'land',land:t.right,height:m.height}];
    m.coords.forEach((p,i)=>surface.set(key(p[0],p[1]),pieces[i]));
    meeples.push({pos:key(m.meeple_pos[0],m.meeple_pos[1]),player:m.player,kind:m.meeple});
  }
  return {surface,meeples};
}
function neighbors(pos){
  const [x,y]=pos.split(',').map(Number);
  return [[x+1,y],[x-1,y],[x,y+1],[x,y-1]].map(([a,b])=>key(a,b));
}
function terrainStats(surface){
  const high={土:0,草:0,岩:0,水:0};
  const big={土:0,草:0,岩:0,水:0};
  const small={土:0,草:0,岩:0,水:0};
  const lands=new Map([...surface.entries()].filter(([,c])=>c.kind==='land').map(([p,c])=>[p,c.land]));
  for(const [p,land] of lands.entries()) high[land]=Math.max(high[land],surface.get(p).height);
  const seen=new Set();
  for(const [start,land] of lands.entries()){
    if(seen.has(start)) continue;
    small[land]+=1;
    const q=[start]; seen.add(start); let size=0;
    while(q.length){
      const here=q.pop(); size+=1;
      for(const nxt of neighbors(here)) if(!seen.has(nxt) && lands.get(nxt)===land){seen.add(nxt);q.push(nxt);}    }
    big[land]=Math.max(big[land],size);
  }
  return {high,big,small};
}
function scoreBreakdown(surface,meeples,stones){
  const fields=[0,1,2,3].map(()=>({statue:0,height:0,big:0,small:0,worker:0,statue_shrine:0,stone:0,bonus:0,total:0}));
  const detail=[0,1,2,3].map(()=>({statue:[],height:[],big:[],small:[],worker:[],statue_shrine:[],stone:'',bonus:'',total:0}));
  const stats=terrainStats(surface);
  const nworkers=[0,0,0,0], nstatues=[0,0,0,0];
  for(const m of meeples){
    const idx=m.player-1;
    if(m.kind==='worker') nworkers[idx]+=1;
    if(m.kind==='statue'){
      nstatues[idx]+=1;
      const adj=neighbors(m.pos).filter(p=>surface.has(p)).map(p=>surface.get(p).height);
      const score=adj.reduce((a,b)=>a+b,0);
      fields[idx].statue+=score;
      detail[idx].statue.push(`${m.pos}：相鄰高度 ${adj.join('+')||'0'} = ${score}`);
    }
  }
  for(const m of meeples){
    if(m.kind!=='priest') continue;
    const idx=m.player-1;
    const cell=surface.get(m.pos);
    let bucket=''; let basis=''; let value=0;
    if(cell.shrine==='height'){
      bucket='height'; value=stats.high[cell.focus]; basis=`${cell.focus} 最高高度 ${value}`;
    }else if(cell.shrine==='big'){
      bucket='big'; value=stats.big[cell.focus]+1; basis=`${cell.focus} 最大連通 ${stats.big[cell.focus]} + 1 = ${value}`;
    }else if(cell.shrine==='small'){
      bucket='small'; value=stats.small[cell.focus]; basis=`${cell.focus} 區域數 ${value}`;
    }else if(cell.shrine==='worker'){
      bucket='worker'; value=nworkers[idx]+1; basis=`自己的工人 ${nworkers[idx]} + 1 = ${value}`;
    }else{
      bucket='statue_shrine'; value=nstatues[idx]+1; basis=`自己的雕像 ${nstatues[idx]} + 1 = ${value}`;
    }
    const score=cell.height*value;
    fields[idx][bucket]+=score;
    const shrineLabel=`${shrineNames[cell.shrine]}${cell.focus?'-'+cell.focus:''}`;
    detail[idx][bucket].push(`${m.pos}：${shrineLabel}，高度 ${cell.height} × (${basis}) = ${score}`);
  }
  const greatest=Math.max(...stones);
  const leaders=stones.map((v,i)=>[v,i]).filter(([v])=>v===greatest).map(([,i])=>i);
  const bonus=leaders.length?Math.floor(6/leaders.length):0;
  for(let i=0;i<4;i++){
    fields[i].stone=Math.floor(stones[i]/2);
    detail[i].stone=`石柱 ${stones[i]} ÷ 2 = ${fields[i].stone}`;
    if(leaders.includes(i)){
      fields[i].bonus=bonus;
      detail[i].bonus=leaders.length===1?`最多石柱獎勵 = ${bonus}`:`並列最多石柱 ${leaders.length} 人，6 ÷ ${leaders.length} = ${bonus}`;
    }else detail[i].bonus='未獲得最多石柱獎勵';
    fields[i].total=fields[i].statue+fields[i].height+fields[i].big+fields[i].small+fields[i].worker+fields[i].statue_shrine+fields[i].stone+fields[i].bonus;
    detail[i].total=fields[i].total;
  }
  return {fields,detail,stats,nworkers,nstatues};
}
function tileStyle(p,surface){
  const cell=surface.get(p); if(!cell) return '';
  const [x,y]=p.split(',').map(Number);
  const same=(dx,dy)=>{const n=surface.get(key(x+dx,y+dy)); return n && n.tile===cell.tile;};
  const styles=[];
  if(same(1,0)) styles.push('border-right-color: transparent;');
  if(same(-1,0)) styles.push('border-left-color: transparent;');
  if(same(0,1)) styles.push('border-bottom-color: transparent;');
  if(same(0,-1)) styles.push('border-top-color: transparent;');
  const r=8;
  styles.push(`border-top-left-radius:${(!same(-1,0)&&!same(0,-1))?r:0}px;`);
  styles.push(`border-top-right-radius:${(!same(1,0)&&!same(0,-1))?r:0}px;`);
  styles.push(`border-bottom-left-radius:${(!same(-1,0)&&!same(0,1))?r:0}px;`);
  styles.push(`border-bottom-right-radius:${(!same(1,0)&&!same(0,1))?r:0}px;`);
  return styles.join('');
}
function draw(){
 const ix=Number(r.value);
 const {surface,meeples}=reconstruct(ix);
 const last=ix?RECORD.moves[ix-1]:null;
 const stones=last?last.stones_after:RECORD.initial_stones;
 const scoreInfo=scoreBreakdown(surface,meeples,stones);
 const points=[...surface.keys(),...meeples.map(m=>m.pos)].map(k=>k.split(',').map(Number));
 const minx=Math.min(...points.map(p=>p[0]))-1,maxx=Math.max(...points.map(p=>p[0]))+1,miny=Math.min(...points.map(p=>p[1]))-1,maxy=Math.max(...points.map(p=>p[1]))+1;
 const width=maxx-minx+1;
 const viewport=Math.min(1000,Math.max(280,document.documentElement.clientWidth-58));
 const autoSize=Math.max(24,Math.min(52,Math.floor(viewport/width)));
 const unit=fitToWidth?autoSize:Math.max(19,Math.min(90,Math.round(autoSize*replayZoom)));
 document.documentElement.style.setProperty('--cell',unit+'px');
 const div=getElement('map');div.style.gridTemplateColumns=`repeat(${width},var(--cell))`;div.innerHTML='';
 const meeplesAt=new Map(meeples.map(m=>[m.pos,m]));
 for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
   const p=key(x,y),cell=surface.get(p),m=meeplesAt.get(p); const el=document.createElement('div'); el.className='sq';
   if(cell){
     if(cell.tile===0) el.classList.add('center-piece');
     el.classList.add(cell.kind==='land'?`terrain-${cell.land}`:'temple');
     el.style.cssText=tileStyle(p,surface);
     const label=document.createElement('div'); label.className='cell-label'+((cell.kind==='shrine' || (cell.kind==='land'&&cell.tile===0))?' small':'');
     label.textContent=cell.kind==='land'?cell.land:`${shrineNames[cell.shrine]}${cell.focus?'-'+cell.focus:''}`;
     el.appendChild(label);
     const ht=document.createElement('div'); ht.className='height-tag'; ht.textContent=`H${cell.height}`; el.appendChild(ht);
     const ct=document.createElement('div'); ct.className='coord-tag'; ct.textContent=`${x},${y}`; el.appendChild(ct);
   }else el.classList.add('empty');
   if(m){
     const badge=document.createElement('div');
     badge.className=`meeple ${m.kind} owner${m.player}`;
     badge.textContent=m.kind==='statue'?'像':m.kind==='worker'?'工':'祭';
     badge.title=`玩家 ${m.player}（${playerColors[m.player]}）${meepleNames[m.kind]}`;
     el.appendChild(badge);
   }
   el.title=`(${x},${y})${cell?`｜高度 ${cell.height}`:''}${cell?.kind==='shrine'?`｜${shrineNames[cell.shrine]}${cell.focus?'-'+cell.focus:''}`:''}${m?`｜玩家 ${m.player}${meepleNames[m.kind]}`:''}`;
   div.appendChild(el);
 }
 getElement('moveLabel').textContent=ix?`第 ${last.round} 輪・玩家 ${last.player}・第 ${ix} / ${RECORD.moves.length} 步`:`開始配置（共 ${RECORD.moves.length} 步）`;
 getElement('detail').textContent=last
   ?`選取板塊 #${last.tile}，取得探索區石柱 ${last.market_stones}。
放置高度：${last.height}，支撐石柱：${last.support_cost}。
米寶行動：放置${meepleNames[last.meeple]}於 (${last.meeple_pos.join(',')})。${last.closed_existing?.length?`\n本步使既有雕像完成封閉：${last.closed_existing.map(([owner,pos])=>`玩家${owner+1}@(${pos[0]},${pos[1]})`).join('、')}`:''}`
   :'初始中央板塊：左上土、右上草、左下水、右下岩。';
 getElement('scores').innerHTML=stones.map((s,p)=>`<div class="chip">玩家 ${p+1}：<b>${s}</b> 石柱；目前總分 <b>${scoreInfo.fields[p].total}</b></div>`).join('');
 const area=getElement('scoreBreakdown');
 const labels=[['statue','雕像高度'],['height','高度聖殿'],['big','大塊聖殿'],['small','小塊聖殿'],['worker','工人聖殿'],['statue_shrine','雕像聖殿']];
 area.innerHTML='';
 scoreInfo.fields.forEach((f,idx)=>{
   const card=document.createElement('div'); card.className='score-card';
   let rows='';
   for(const [k,name] of labels){ rows += `<tr><td>${name}</td><td>${f[k]}</td></tr>`; }
   rows += `<tr><td>剩餘石柱</td><td>${f.stone}</td></tr>`;
   rows += `<tr><td>最多石柱獎勵</td><td>${f.bonus}</td></tr>`;
   rows += `<tr class="total-row"><td>總分</td><td>${f.total}</td></tr>`;
   let notes='';
   for(const [k,name] of labels){
     const arr=scoreInfo.detail[idx][k];
     if(arr.length) notes += `<li><b>${name}</b>：${arr.join('； ')}</li>`;
   }
   notes += `<li><b>剩餘石柱</b>：${scoreInfo.detail[idx].stone}</li>`;
   notes += `<li><b>最多石柱獎勵</b>：${scoreInfo.detail[idx].bonus}</li>`;
   card.innerHTML=`<h3>玩家 ${idx+1}（${playerColors[idx+1]}）</h3><table>${rows}</table><div class="subnote">工人數：${scoreInfo.nworkers[idx]}；雕像數：${scoreInfo.nstatues[idx]}</div><ul class="inline-list">${notes}</ul>`;
   area.appendChild(card);
 });
}
getElement('prev').onclick=()=>{r.value=Math.max(0,Number(r.value)-1);draw()};
getElement('next').onclick=()=>{r.value=Math.min(RECORD.moves.length,Number(r.value)+1);draw()};
getElement('first').onclick=()=>{r.value=0;draw()};
r.oninput=draw;
getElement('zoomout').onclick=()=>{fitToWidth=false;replayZoom=Math.max(0.5,replayZoom-0.3);draw()};
getElement('zoomin').onclick=()=>{fitToWidth=false;replayZoom=Math.min(4,replayZoom+0.3);draw()};
getElement('fit').onclick=()=>{fitToWidth=true;replayZoom=1;draw()};
window.addEventListener('resize',draw);
draw();
</script></body></html>
